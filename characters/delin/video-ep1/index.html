    <script>
      const tl = gsap.timeline({ paused: true });
      const T = 0.35;
      // slow push-in on every shot so no frame sits still
      tl.fromTo("#v1-i", { scale: 1 }, { scale: 1.06, duration: 6.4, ease: "none" }, 0);
      tl.fromTo("#v2-i", { scale: 1 }, { scale: 1.06, duration: 5.6, ease: "none" }, 6.05);
      tl.fromTo("#v3-i", { scale: 1 }, { scale: 1.06, duration: 5.3, ease: "none" }, 11.3);
      tl.fromTo("#v4-i", { scale: 1 }, { scale: 1.06, duration: 6.9, ease: "none" }, 16.25);
      tl.fromTo("#v5-i", { scale: 1 }, { scale: 1.06, duration: 4.9, ease: "none" }, 22.8);
      // 1 -> 2: zoom-through
      tl.fromTo("#v1-o", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 1.6, opacity: 0, filter: "blur(14px)", duration: T, ease: "power4.in" }, 6.05);
      tl.fromTo("#v2-o", { scale: 0.55, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: T, ease: "power4.out" }, 6.05);
      // 2 -> 3: whip pan left
      tl.fromTo("#v2-o", { x: 0, filter: "blur(0px)" }, { x: -1080, filter: "blur(18px)", duration: T, immediateRender: false, ease: "power4.inOut" }, 11.3);
      tl.fromTo("#v3-o", { x: 1080, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: T, ease: "power4.inOut" }, 11.3);
      // 3 -> 4: white flash cut
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, 16.25);
      tl.fromTo("#v4-o", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 16.36);
      tl.fromTo("#v4-o", { scale: 1.12 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 16.37);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 16.37);
      // 4 -> 5: swipe up
      tl.fromTo("#v4-o", { y: 0, filter: "blur(0px)" }, { y: -700, filter: "blur(12px)", duration: T, ease: "power4.inOut", immediateRender: false }, 22.8);
      tl.fromTo("#v5-o", { y: 1920 }, { y: 0, duration: T, ease: "power4.inOut" }, 22.8);
      window.__timelines["main"] = tl;
    </script>
